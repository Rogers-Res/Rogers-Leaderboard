<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rogers Res — Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171C;
    --ink-soft:#4B5160;
    --subtle:#6B7280;
    --faint:#9AA1AC;
    --bg:#F1F3F6;
    --surface:#FFFFFF;
    --surface-2:#F8F9FB;
    --border:#E2E5EA;
    --border-strong:#CDD2DA;
    --brand:#1E4B6B;
    --brand-dark:#123350;
    --brand-tint:#E7EEF3;
    --brand-tint-2:#DCE7EE;
    --green:#1E7A46;
    --green-bg:#E5F4EA;
    --green-border:#BFE3CC;
    --yellow:#8A6100;
    --yellow-bg:#FDF3D8;
    --yellow-border:#F2DFA0;
    --red:#B42318;
    --red-bg:#FCEAE8;
    --red-border:#F3C6C0;
    --gray:#5B6270;
    --gray-bg:#EDEFF2;
    --gray-border:#DADEE4;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-card: 0 1px 2px rgba(20,23,28,0.04), 0 1px 1px rgba(20,23,28,0.03);
    --font: 'Libre Franklin', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-variant-numeric: tabular-nums;
  }
  ::selection{ background: var(--brand-tint-2); }

  .wrap{max-width:1280px;margin:0 auto;padding:0 24px 80px;}

  /* ---------- MASTHEAD ---------- */
  header.masthead{
    background: linear-gradient(180deg, var(--brand-dark) 0%, var(--brand) 100%);
    color:#fff;
    padding: 28px 0 26px;
  }
  .masthead-inner{
    max-width:1280px;margin:0 auto;padding:0 24px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .brand-block{display:flex; align-items:center; gap:14px;}
  .brand-mark{
    width:44px;height:44px;border-radius:10px;
    background: rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.22);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:18px; letter-spacing:-0.02em;
    flex-shrink:0;
  }
  .brand-text .campaign{
    font-weight:800; font-size:22px; letter-spacing:-0.01em; line-height:1.15;
  }
  .brand-text .sub{
    font-weight:500; font-size:13.5px; color:rgba(255,255,255,0.72); margin-top:2px;
  }
  .masthead-actions{ display:flex; align-items:center; gap:10px; }
  .lang-toggle{
    display:flex; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
    border-radius:999px; padding:3px; gap:2px;
  }
  .lang-toggle button{
    border:none; background:transparent; color:rgba(255,255,255,0.75);
    font-family:var(--font); font-weight:700; font-size:12.5px; letter-spacing:0.02em;
    padding:6px 13px; border-radius:999px; cursor:pointer; transition: all .15s ease;
  }
  .lang-toggle button.active{ background:#fff; color:var(--brand-dark); }

  .week-pill{
    font-size:12.5px; font-weight:600; color:rgba(255,255,255,0.85);
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    padding:6px 12px; border-radius:999px;
  }

  /* Hero KPI row */
  .hero-kpis{
    max-width:1280px;margin:22px auto 0;padding:0 24px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  }
  .kpi-card{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    border-radius:var(--radius-md); padding:14px 16px;
  }
  .kpi-card .kpi-value{ font-size:26px; font-weight:800; color:#fff; letter-spacing:-0.01em; }
  .kpi-card .kpi-label{ font-size:12px; font-weight:600; color:rgba(255,255,255,0.68); margin-top:2px; }

  /* ---------- FILTER BAR ---------- */
  .filterbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 rgba(20,23,28,0.02);
  }
  .filterbar-inner{
    max-width:1280px;margin:0 auto;padding:14px 24px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .segmented{
    display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px;
  }
  .segmented button{
    border:none; background:transparent; font-family:var(--font); cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink-soft); padding:7px 13px; border-radius:8px;
    white-space:nowrap;
  }
  .segmented button.active{ background:var(--brand); color:#fff; }
  .filter-note{ font-size:12px; color:var(--faint); }
  .custom-range-wrap{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .custom-range-wrap .crf-label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .custom-range-wrap input[type="date"]{
    border:1px solid var(--border-strong); border-radius:7px; padding:6px 9px;
    font-family:var(--font); font-size:12.5px; color:var(--ink); background:var(--surface);
  }
  .custom-range-wrap .crf-apply{
    background:var(--brand); color:#fff; border:none; border-radius:7px; padding:7px 14px;
    font-family:var(--font); font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .custom-range-wrap .crf-apply:hover{ background:var(--brand-dark); }

  .chip-row{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;
  }
  .chip{
    border:1px solid var(--border-strong); background:var(--surface);
    padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:7px;
    transition: all .12s ease;
  }
  .chip:hover{ border-color:var(--brand); color:var(--brand); }
  .chip.active{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .chip .chip-dot{ width:7px;height:7px;border-radius:50%; background:currentColor; opacity:.55;}
  .chip .chip-count{ opacity:.7; font-weight:700; }

  /* ---------- SECTIONS ---------- */
  section{ margin-top:36px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
  .section-head h2{ font-size:19px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .section-head .section-sub{ font-size:13px; color:var(--subtle); }

  .banner{
    background:var(--yellow-bg); border:1px solid var(--yellow-border); color:#6B4E00;
    border-radius:var(--radius-md); padding:12px 16px; font-size:13px; line-height:1.5; margin-bottom:16px;
  }
  .banner strong{ color:#5A4000; }

  .columns-panel{
    position:absolute; top:calc(100% + 6px); right:0; z-index:30; min-width:220px;
    background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(20,23,28,0.12); padding:8px; flex-direction:column; gap:1px;
  }
  .columns-panel:not([hidden]){ display:flex; }
  .columns-panel[hidden]{ display:none; }
  .columns-panel label{
    display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:6px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .columns-panel label:hover{ background:var(--surface-2); }
  .columns-panel input[type="checkbox"]{ accent-color:var(--brand); width:14px; height:14px; }
  .columns-panel-footer{ border-top:1px solid var(--border); margin-top:4px; padding-top:6px; }
  .columns-done-btn{
    width:100%; background:var(--brand); color:#fff; border:none; border-radius:7px;
    padding:8px 0; font-family:var(--font); font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .columns-done-btn:hover{ background:var(--brand-dark); }

  /* ---------- OFFICE TABLE ---------- */
  .table-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    overflow-x:auto; overflow-y:hidden; box-shadow:var(--shadow-card);
  }
  table.office-table{ width:100%; min-width:1080px; border-collapse:collapse; font-size:13.5px; }
  table.office-table thead th{
    text-align:left; font-size:11.5px; font-weight:700; color:var(--faint);
    padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap;
    letter-spacing:0.01em;
  }
  table.office-table thead th.num{ text-align:right; }
  table.office-table thead th.sortable{ cursor:pointer; user-select:none; transition:color .12s ease; }
  table.office-table thead th.sortable:hover{ color:var(--brand); }
  table.office-table thead th.sortable .arrow{ display:inline-block; margin-left:4px; font-size:10px; opacity:0; transition:opacity .12s ease; }
  table.office-table thead th.sortable.active{ color:var(--brand); }
  table.office-table thead th.sortable.active .arrow{ opacity:1; }
  table.office-table tbody td{
    padding:13px 16px; border-bottom:1px solid var(--border); vertical-align:middle;
  }
  table.office-table tbody tr:last-child td{ border-bottom:none; }
  table.office-table tbody tr{ cursor:pointer; transition:background .1s ease; }
  table.office-table tbody tr:hover{ background:var(--surface-2); }
  table.office-table td.num{ text-align:right; font-weight:600; }
  .office-name-cell{ display:flex; flex-direction:column; white-space:nowrap; }
  .office-name-cell .oname{ font-weight:700; color:var(--ink); }
  .office-name-cell .oprov{ font-size:11.5px; color:var(--faint); font-weight:600; margin-top:1px;}

  .metric-pill{
    display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
    font-weight:700; font-size:12.5px;
  }
  .metric-pill.green{ background:var(--green-bg); color:var(--green); }
  .metric-pill.yellow{ background:var(--yellow-bg); color:var(--yellow); }
  .metric-pill.red{ background:var(--red-bg); color:var(--red); }
  .metric-pill.gray{ background:var(--gray-bg); color:var(--gray); }

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:7px;
    font-weight:800; font-size:11px; letter-spacing:0.02em; white-space:nowrap;
  }
  .badge.green{ background:var(--green-bg); color:var(--green); border:1px solid var(--green-border);}
  .badge.yellow{ background:var(--yellow-bg); color:var(--yellow); border:1px solid var(--yellow-border);}
  .badge.red{ background:var(--red-bg); color:var(--red); border:1px solid var(--red-border);}
  .badge.gray{ background:var(--gray-bg); color:var(--gray); border:1px solid var(--gray-border);}

  .nodata-txt{ color:var(--faint); font-style:italic; font-size:12.5px; font-weight:500; }

  /* ---------- REP GRID ---------- */
  .rep-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;
  }
  .search-input{
    border:1px solid var(--border-strong); background:var(--surface); border-radius:9px;
    padding:9px 14px; font-family:var(--font); font-size:13.5px; width:260px; color:var(--ink);
  }
  .search-input:focus{ outline:2px solid var(--brand); outline-offset:1px; }
  .sort-select{
    border:1px solid var(--border-strong); background:var(--surface); border-radius:9px;
    padding:9px 12px; font-family:var(--font); font-size:13px; font-weight:600; color:var(--ink-soft);
  }

  .rep-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px;
  }
  .rep-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; box-shadow:var(--shadow-card); position:relative; overflow:hidden;
  }
  .rep-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .rep-card.b-green::before{ background:var(--green); }
  .rep-card.b-yellow::before{ background:var(--yellow); }
  .rep-card.b-red::before{ background:var(--red); }
  .rep-card.b-gray::before{ background:var(--faint); }

  .rep-card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .rep-name{ font-weight:800; font-size:15px; letter-spacing:-0.005em; line-height:1.25;}
  .rep-office{ font-size:12px; color:var(--subtle); font-weight:600; margin-top:2px;}

  .rep-metrics{ display:grid; grid-template-columns:1fr 1fr; gap:9px 10px; margin-top:4px;}
  .metric-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 10px;
  }
  .metric-box .m-label{ font-size:10.5px; font-weight:700; color:var(--faint); text-transform:none; letter-spacing:0.01em;}
  .metric-box .m-value{ font-size:15px; font-weight:800; margin-top:2px; }
  .metric-box .m-value.green{ color:var(--green); }
  .metric-box .m-value.yellow{ color:#8A6100; }
  .metric-box .m-value.red{ color:var(--red); }
  .metric-box .m-value.plain{ color:var(--ink); }
  .metric-box .m-sub{ font-size:10.5px; color:var(--faint); font-weight:600; margin-top:1px;}

  .rep-footer{
    margin-top:11px; padding-top:11px; border-top:1px dashed var(--border);
    font-size:12px;
  }
  .pay-value{ font-weight:800; font-size:14px; }
  .productmix-tag{
    display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); background:var(--gray-bg);
    padding:5px 9px; border-radius:6px; line-height:1.5;
  }

  footer.site-footer{
    max-width:1280px;margin:40px auto 0;padding:20px 24px; border-top:1px solid var(--border);
    font-size:12px; color:var(--faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:900px){
    .hero-kpis{ grid-template-columns:repeat(2,1fr); }
    table.office-table{ font-size:12.5px; }
  }
  @media (max-width:560px){
    .hero-kpis{ grid-template-columns:1fr 1fr; padding:0 16px; }
    .wrap{ padding:0 16px 60px; }
    .masthead-inner{ padding:0 16px; }
    .filterbar-inner{ padding:12px 16px; }
    .rep-grid{ grid-template-columns:1fr; }
    .search-input{ width:100%; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand-block">
      <div class="brand-mark">RR</div>
      <div class="brand-text">
        <div class="campaign" data-i18n="campaignTitle">Rogers Res</div>
        <div class="sub" data-i18n="campaignSub">Scorecard</div>
      </div>
    </div>
    <div class="masthead-actions">
      <span class="week-pill" id="weekPill">Week of Sep 13–19, 2026</span>
      <div class="lang-toggle">
        <button id="langEnBtn" class="active">EN</button>
        <button id="langFrBtn">FR</button>
      </div>
    </div>
  </div>
  <div class="hero-kpis" id="heroKpis"></div>
</header>

<div class="filterbar">
  <div class="filterbar-inner">
    <div class="segmented" id="dateSegment">
      <button data-range="thisweek" data-i18n="rangeThisWeek">This Week (Pay)</button>
      <button data-range="week" class="active" data-i18n="rangeWeek">Last Week</button>
      <button data-range="month" data-i18n="rangeMonth">Last Month</button>
      <button data-range="90d" data-i18n="range90">Last 90 Days</button>
      <button data-range="all" data-i18n="rangeAll">All Time</button>
      <button data-range="custom" data-i18n="rangeCustom">Custom Range</button>
    </div>
    <div class="custom-range-wrap" id="customRangeWrap" hidden></div>
    <span class="filter-note" id="rangeNote"></span>
  </div>
</div>

<div class="wrap">

  <section id="officesSection">
    <div class="section-head">
      <h2 data-i18n="officeRankingsTitle">Office Rankings</h2>
      <div style="display:flex; align-items:center; gap:14px; position:relative;">
        <span class="section-sub" data-i18n="officeRankingsSub">Tap a row to filter the reps below to that office</span>
        <button id="columnsBtn" class="chip" style="padding:6px 12px; font-size:12.5px;" type="button">
          <span data-i18n="columnsBtnLabel">Columns</span>
        </button>
        <div id="columnsPanel" class="columns-panel" hidden></div>
      </div>
    </div>
    <div class="table-card">
      <table class="office-table">
        <thead>
          <tr id="officeHeaderRow"></tr>
        </thead>
        <tbody id="officeTbody"></tbody>
      </table>
    </div>
  </section>

  <section id="repsSection">
    <div class="section-head">
      <h2 data-i18n="repCardsTitle">Rep Performance</h2>
      <span class="section-sub" id="repCountSub"></span>
    </div>
    <div class="chip-row" id="officeChips"></div>
    <div class="rep-toolbar">
      <input type="text" class="search-input" id="repSearch" data-i18n-ph="searchPlaceholder" placeholder="Search reps...">
      <select class="sort-select" id="sortSelect">
        <option value="conv_desc" data-i18n="sortConvDesc">Sort: Conversion % (high–low)</option>
        <option value="sales_desc" data-i18n="sortSalesDesc">Sort: Sales (high–low)</option>
        <option value="name_asc" data-i18n="sortNameAsc">Sort: Name (A–Z)</option>
        <option value="pay_desc" data-i18n="sortPayDesc">Sort: Pay (high–low)</option>
      </select>
    </div>
    <div class="rep-grid" id="repGrid"></div>
  </section>

  <footer class="site-footer">
    <span data-i18n="footerLeft">Rogers Res · Cydcor Canada · Internal performance tool</span>
    <span id="footerRight"></span>
  </footer>

        doors_per_day: m.doorsWeightDays ? m.doorsSum/m.doorsWeightDays : null,
        disp_per_day: m.dispWeightDays ? m.dispSum/m.dispWeightDays : null,
        cancel_pct: avg(m.cancelVals),
        disconnect_pct: avg(m.discVals),
        product_mix: m.hasProductMix ? m.productMix : null,
        total_products: m.hasProductMix ? m.totalProducts : null,
      };
    });
  }

  function buildEffectiveOfficePay(weeks){
    var map = {}; // office -> {wireSum, wireCount, avgPaySum, avgPayCount, oppSum, oppCount, hrsSum, hrsCount}
    weeks.forEach(function(wk){
      Object.keys(wk.office_pay).forEach(function(o){
        var p = wk.office_pay[o];
        if (!map[o]) map[o] = {wireSum:0, wireCount:0, avgPaySum:0, avgPayCount:0, oppSum:0, oppCount:0, hrsSum:0, hrsCount:0};
        var m = map[o];
        if (p.owner_pay_total!=null){ m.wireSum += p.owner_pay_total; m.wireCount++; }
        if (p.avg_rep_pay!=null){ m.avgPaySum += p.avg_rep_pay; m.avgPayCount++; }
        if (p.owner_personal_production!=null){ m.oppSum += p.owner_personal_production; m.oppCount++; }
        if (p.avg_field_hrs_per_repday!=null){ m.hrsSum += p.avg_field_hrs_per_repday; m.hrsCount++; }
      });
    });
    var out = {};
    Object.keys(map).forEach(function(o){
      var m = map[o];
      out[o] = {
        owner_pay_total: m.wireCount ? m.wireSum : null,
        avg_rep_pay: m.avgPayCount ? m.avgPaySum/m.avgPayCount : null,
        owner_personal_production: m.oppCount ? m.oppSum : null,
        avg_field_hrs_per_repday: m.hrsCount ? m.hrsSum/m.hrsCount : null,
      };
    });
    return out;
  }

  // recomputed on every render/range-change
  var CUR_WEEKS = [];
  var MASTER = [];
  var OFFICE_PAY = {};

  function recomputeData(){
    if (state.range === 'thisweek'){
      CUR_WEEKS = [];
      MASTER = [];
      OFFICE_PAY = (THIS_WEEK_PAY && THIS_WEEK_PAY.office_pay) || {};
      return;
    }
    CUR_WEEKS = effectiveWeeks();
    MASTER = buildEffectiveRepMap(CUR_WEEKS);
    OFFICE_PAY = buildEffectiveOfficePay(CUR_WEEKS);
  }

  // ---------------- Threshold logic ----------------
  function conversionColor(rep){
    var office = OFFICE_MAP[rep.office];
    if (!office || office.target==null || !rep.has_conversion_data) return 'gray';
    var target = office.target;
    if (rep.conv_pct >= target) return 'green';
    if (rep.conv_pct >= target - 0.005) return 'yellow';
    return 'red';
  }
  function salesColor(sales, weeksN){
    if (sales===null||sales===undefined) return 'gray';
    var threshold = 6 * Math.max(1, weeksN||1);
    return sales >= threshold ? 'green' : 'red';
  }
  function doorsPerDayColor(v){
    if (v==null) return 'gray';
    if (v >= 50) return 'green';
    if (v >= 40) return 'yellow';
    return 'red';
  }
  function hrsPerDayColor(v){
    if (v==null) return 'gray';
    if (v >= 6) return 'green';
    if (v >= 5.5) return 'yellow';
    return 'red';
  }
  function daysWorkedColor(v, weeksN){
    if (v==null) return 'gray';
    var n = Math.max(1, weeksN||1);
    if (v >= 6*n) return 'green';
    if (v >= 4*n) return 'yellow';
    return 'red';
  }
  function cancelColor(v){
    if (v==null) return 'gray';
    if (v < 0.10) return 'green';
    if (v <= 0.12) return 'yellow';
    return 'red';
  }
  function discColor(v){
    if (v==null) return 'gray';
    if (v <= 0.06) return 'green';
    if (v <= 0.08) return 'yellow';
    return 'red';
  }
  function repBadge(rep){
    if (!rep.has_conversion_data) return {code:'nodata', color:'gray', label:t('badgeNoData')};
    if (rep.conv_sales !== null && rep.conv_sales <= 2) return {code:'lowvol', color:'gray', label:t('badgeLowVol')};
    var c = conversionColor(rep);
    if (c === 'green') return {code:'strong', color:'green', label:t('badgeStrong')};
    if (c === 'yellow') return {code:'monitor', color:'yellow', label:t('badgeMonitor')};
    if (c === 'red') return {code:'atrisk', color:'red', label:t('badgeAtRisk')};
    return {code:'nodata', color:'gray', label:t('badgeNoData')};
  }

  // ---------------- Office aggregates (rep-level rollup for a given office) ----------------
  function officeAggregates(officeName){
    var reps = MASTER.filter(function(r){ return r.office===officeName; });
    var withConv = reps.filter(function(r){ return r.has_conversion_data; });
    var doors = withConv.reduce(function(s,r){ return s+r.unique_doors; },0);
    var sales = withConv.reduce(function(s,r){ return s+r.conv_sales; },0);
    var convPct = doors>0 ? sales/doors : null;
    var cancelVals = reps.filter(function(r){return r.cancel_pct!=null;}).map(function(r){return r.cancel_pct;});
    var discVals = reps.filter(function(r){return r.disconnect_pct!=null;}).map(function(r){return r.disconnect_pct;});
    var withProducts = reps.filter(function(r){ return r.total_products!=null; });
    var totalProducts = withProducts.reduce(function(s,r){ return s+r.total_products; },0);
    var avg = function(arr){ return arr.length? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; };
    return {
      reps: reps, repCount: reps.length,
      doors: withConv.length? doors : null,
      sales: withConv.length? sales : null,
      convPct: withConv.length? convPct : null,
      cancelPct: avg(cancelVals),
      discPct: avg(discVals),
      totalProducts: withProducts.length ? totalProducts : null,
    };
  }

  // ---------------- Rendering ----------------
  function renderHeroKpis(){
    if (state.range === 'thisweek'){
      var totalWire = Object.keys(OFFICE_PAY).reduce(function(s,o){ return s + (OFFICE_PAY[o].owner_pay_total||0); },0);

      document.getElementById('heroKpis').innerHTML = [

      ].join('');
      return;
    }
    var withConv = MASTER.filter(function(r){ return r.has_conversion_data; });
    var totalSales = withConv.reduce(function(s,r){return s+r.conv_sales;},0);
    var totalDoors = withConv.reduce(function(s,r){return s+r.unique_doors;},0);

      kpiCard(totalSales, t('kpiTotalSales')),
      kpiCard(pct(convPct,2), t('kpiConv')),
      kpiCard(headcount, t('kpiHeadcount')),
    ].join('');

  var COLS_KEY_TO_FN = {}; // filled below after helpers defined

  function colVal(key, o, agg, weeksN){
    var op = OFFICE_PAY[o.office] || {};
    switch(key){
      case 'reps': return agg.repCount || (op.active_reps!=null ? op.active_reps : -1);
      case 'conv': return agg.convPct === null ? -1 : agg.convPct;
      case 'sales': return agg.sales === null ? -1 : agg.sales;
      case 'products': return agg.totalProducts === null ? -1 : agg.totalProducts;
      case 'hrsday': return op.avg_field_hrs_per_repday == null ? -1 : op.avg_field_hrs_per_repday;
      case 'cancel': return agg.cancelPct === null ? -1 : agg.cancelPct;
      case 'disc': return agg.discPct === null ? -1 : agg.discPct;
      case 'pay': return op.owner_pay_total == null ? -1 : op.owner_pay_total;
      case 'strokerep': return (op.owner_pay_total == null || !agg.repCount) ? -1 : op.owner_pay_total / agg.repCount;
      case 'avgpay': return op.avg_rep_pay == null ? -1 : op.avg_rep_pay;
      case 'ownerprod': return op.owner_personal_production == null ? -1 : op.owner_personal_production;
      default: return 0;
    }
  }

  function colCell(key, o, agg, weeksN){
    var op = OFFICE_PAY[o.office] || {};
    switch(key){
      case 'reps':
        return agg.repCount || (op.active_reps!=null ? op.active_reps : '<span class="nodata-txt">\u2014</span>');
      case 'conv':
        if (agg.convPct===null) return '<span class="nodata-txt">'+t('noConvShort')+'</span>';
        var color = o.target!=null ? (agg.convPct>=o.target?'green':(agg.convPct>=o.target-0.005?'yellow':'red')) : 'gray';
        var targetTxt = o.target!=null ? ' <span style="color:var(--faint);font-weight:600;">/ '+pct(o.target,2)+' '+t('target').toLowerCase()+'</span>' : '';
        return '<span class="metric-pill '+color+'">'+pct(agg.convPct,2)+'</span>'+targetTxt;
      case 'sales':
        return agg.sales!==null ? agg.sales : '<span class="nodata-txt">\u2014</span>';
      case 'products':
        return agg.totalProducts!==null ? agg.totalProducts : '<span class="nodata-txt">\u2014</span>';
      case 'hrsday':
        var hv = op.avg_field_hrs_per_repday;
        return (hv!=null) ? '<span class="metric-pill '+hrsPerDayColor(hv)+'">'+round1(hv)+'</span>' : '<span class="nodata-txt">\u2014</span>';
      case 'cancel':
        return agg.cancelPct!==null ? '<span class="metric-pill '+cancelColor(agg.cancelPct)+'">'+pct(agg.cancelPct,1)+'</span>' : '<span class="nodata-txt">\u2014</span>';
      case 'disc':
        return agg.discPct!==null ? '<span class="metric-pill '+discColor(agg.discPct)+'">'+pct(agg.discPct,1)+'</span>' : '<span class="nodata-txt">\u2014</span>';
      case 'pay':
        return op.owner_pay_total!=null ? moneyRound(op.owner_pay_total) : '<span class="nodata-txt">\u2014</span>';
      case 'strokerep':
        return (op.owner_pay_total!=null && agg.repCount) ? money(op.owner_pay_total/agg.repCount) : '<span class="nodata-txt">\u2014</span>';
      case 'avgpay':
        return op.avg_rep_pay!=null ? money(op.avg_rep_pay) : '<span class="nodata-txt">\u2014</span>';
      case 'ownerprod':
        return op.owner_personal_production!=null ? money(op.owner_personal_production) : '<span class="nodata-txt">\u2014</span>';
      default: return '';
    }
  }

  function renderOfficeTable(){
    var headerRow = document.getElementById('officeHeaderRow');
    var tbody = document.getElementById('officeTbody');
    var visibleCols = COLS.filter(function(c){ return !state.hiddenCols.has(c.key); });
    var weeksN = CUR_WEEKS.length;

    headerRow.innerHTML = '<th class="sortable" data-sort="office">'+t('colOffice')+'<span class="arrow"></span></th>' +
      visibleCols.map(function(c){ return '<th class="num sortable" data-sort="'+c.key+'">'+t(c.label)+'<span class="arrow"></span></th>'; }).join('');
    Array.prototype.forEach.call(headerRow.querySelectorAll('th.sortable'), function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-sort');
        if (state.officeSortKey === k){ state.officeSortDir = state.officeSortDir === 'asc' ? 'desc' : 'asc'; }
        else { state.officeSortKey = k; state.officeSortDir = (k === 'office') ? 'asc' : 'desc'; }
        renderOfficeTable();
      });
    });

    var rows = OFFICES.map(function(o){ return {o:o, agg:officeAggregates(o.office)}; })
      .filter(function(row){ return row.agg.repCount > 0 || (OFFICE_PAY[row.o.office] && Object.keys(OFFICE_PAY[row.o.office]).length); });

    var key = state.officeSortKey, dir = state.officeSortDir === 'asc' ? 1 : -1;
    rows.sort(function(a,b){
      var av = key==='office' ? a.o.office.toLowerCase() : colVal(key, a.o, a.agg, weeksN);
      var bv = key==='office' ? b.o.office.toLowerCase() : colVal(key, b.o, b.agg, weeksN);
      if (typeof av === 'string' || typeof bv === 'string'){
        return dir===1 ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
      }
      return dir===1 ? (av-bv) : (bv-av);
    });

    tbody.innerHTML = rows.map(function(row){
      var o = row.o, agg = row.agg;
      var displayReps = agg.repCount || (OFFICE_PAY[o.office] && OFFICE_PAY[o.office].active_reps) || 0;
      var officeTd = '<td><div class="office-name-cell"><span class="oname">'+o.office+'</span><span class="oprov">'+(o.province||'')+' \u00b7 '+displayReps+' '+t('reps')+'</span></div></td>';
      var restTd = visibleCols.map(function(c){ return '<td class="num">'+colCell(c.key, o, agg, weeksN)+'</td>'; }).join('');
      return '<tr data-office="'+escapeAttr(o.office)+'">' + officeTd + restTd + '</tr>';
    }).join('');

    Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
      tr.addEventListener('click', function(){
        var office = tr.getAttribute('data-office');
        state.office = (state.office===office) ? 'all' : office;
        renderChips();
        renderRepGrid();
        document.getElementById('repsSection').scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
    updateSortHeaderUI();
  }

  function updateSortHeaderUI(){
    Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function(th){
      var k = th.getAttribute('data-sort');
      th.classList.toggle('active', k===state.officeSortKey);
      var arrow = th.querySelector('.arrow');
      if (!arrow){ arrow = document.createElement('span'); arrow.className='arrow'; th.appendChild(arrow); }
      arrow.textContent = (k===state.officeSortKey) ? (state.officeSortDir==='asc'?'\u25B2':'\u25BC') : '\u25BC';
    });

  function renderColumnsPanel(){

    panel.innerHTML = COLS.map(function(c){
      var checked = state.hiddenCols.has(c.key) ? '' : 'checked';
      return '<label><input type="checkbox" data-col="'+c.key+'" '+checked+'> '+t(c.label)+'</label>';
    }).join('') + '<div class="columns-panel-footer"><button type="button" id="columnsDoneBtn" class="columns-done-btn">'+t('doneBtnLabel')+'</button></div>';

  function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function metricBox(label, value, colorClass, sub){
    return '<div class="metric-box"><div class="m-label">'+label+'</div><div class="m-value '+(colorClass||'plain')+'">'+value+'</div>' +
      (sub? '<div class="m-sub">'+sub+'</div>' : '') + '</div>';
  }

  function renderRepCard(rep){
    var badge = repBadge(rep);
    var weeksN = CUR_WEEKS.length;
    var doorsPerDay = rep.doors_per_day!=null ? rep.doors_per_day : null;
    var dispPerDay = rep.disp_per_day!=null ? rep.disp_per_day : null;
    var hrsPerDay = rep.hrs_per_day!=null ? rep.hrs_per_day : null;
    var salesForCard = rep.has_conversion_data ? rep.conv_sales : rep.sales_week;
    var salesPerDay = (salesForCard!=null && rep.days_worked) ? salesForCard/rep.days_worked : null;

    var boxes = [];
    if (rep.has_conversion_data){
      boxes.push(metricBox(t('mSales'), salesForCard, salesColor(salesForCard, weeksN)));
      boxes.push(metricBox('Conv %', pct(rep.conv_pct,2), conversionColor(rep)));
    } else {
      boxes.push(metricBox(t('mSales'), salesForCard!=null?salesForCard:'\u2014', 'plain', t('noConvShort')));
      boxes.push(metricBox('Conv %', '\u2014', 'gray', t('noConvShort')));
    }
    boxes.push(metricBox(t('mSalesPerDay'), salesPerDay!=null?round1(salesPerDay):'\u2014', 'plain'));
    boxes.push(metricBox(t('mUniqueDoorsPerDay'), doorsPerDay!=null?Math.round(doorsPerDay):'\u2014', doorsPerDayColor(doorsPerDay)));
    boxes.push(metricBox(t('mDispPerDay'), dispPerDay!=null?Math.round(dispPerDay):'\u2014', 'plain'));
    boxes.push(metricBox(t('mHrsPerDay'), hrsPerDay!=null?round1(hrsPerDay):'\u2014', hrsPerDayColor(hrsPerDay)));
    boxes.push(metricBox(t('mDays'), rep.days_worked!=null?rep.days_worked:'\u2014', daysWorkedColor(rep.days_worked, weeksN)));
    boxes.push(metricBox(t('mCancel'), rep.cancel_pct!=null?pct(rep.cancel_pct,1):'\u2014', cancelColor(rep.cancel_pct)));
    boxes.push(metricBox(t('mDisc'), rep.disconnect_pct!=null?pct(rep.disconnect_pct,1):'\u2014', discColor(rep.disconnect_pct)));

    var mixLine;
    if (rep.product_mix){
      var parts = Object.keys(rep.product_mix)
        .filter(function(p){ return rep.product_mix[p] > 0; })
        .sort(function(a,b){ return rep.product_mix[b]-rep.product_mix[a]; })
        .map(function(p){ return productLabel(p)+' '+rep.product_mix[p]; });
      mixLine = '<span class="productmix-tag">'+t('mProductMix')+' ('+rep.total_products+'): '+parts.join(' \u00b7 ')+'</span>';
    } else {
      mixLine = '<span class="productmix-tag">'+t('mProductMix')+': '+t('noProductData')+'</span>';
    }

    return '<div class="rep-card b-'+badge.color+'">' +
      '<div class="rep-card-head"><div><div class="rep-name">'+escapeHtml(rep.rep)+'</div><div class="rep-office">'+escapeHtml(rep.office)+'</div></div>' +
      '<span class="badge '+badge.color+'">'+badge.label+'</span></div>' +
      '<div class="rep-metrics">'+boxes.join('')+'</div>' +
      '<div class="rep-footer">'+mixLine+'</div>' +
    '</div>';
  }

  function productLabel(p){
    var map = {
      'Home Security': t('prodHomeSecurity'), 'Internet': t('prodInternet'),
      'Mobility': t('prodMobility'), 'Phone': t('prodPhone'), 'TV': t('prodTV')
    };
    return map[p] || p;
  }

  function renderRepGrid(){
    var list = MASTER.slice();
    if (state.office!=='all') list = list.filter(function(r){ return r.office===state.office; });
    if (state.search){
      var q = state.search.toLowerCase();
      list = list.filter(function(r){ return r.rep.toLowerCase().indexOf(q)!==-1; });
    }
    list.sort(function(a,b){
      switch(state.sort){
        case 'sales_desc':
          var av = a.has_conversion_data?a.conv_sales:(a.sales_week||0);
          var bv = b.has_conversion_data?b.conv_sales:(b.sales_week||0);
          return bv-av;
        case 'name_asc': return a.rep.localeCompare(b.rep);
        case 'pay_desc': return 0; // individual pay no longer shown/available
        case 'conv_desc':
        default:
          var avv = a.has_conversion_data ? a.conv_pct : -1;
          var bvv = b.has_conversion_data ? b.conv_pct : -1;
          return bvv-avv;
      }
    });
    document.getElementById('repGrid').innerHTML = list.map(renderRepCard).join('');
    document.getElementById('repCountSub').textContent = list.length + ' ' + t('repsShowing');
  }

  function renderChips(){

      OFFICES.filter(function(o){ return counts[o.office]; })
        .sort(function(a,b){ return a.office.localeCompare(b.office); })
        .map(function(o){ return {office:o.office, label:o.office, count:counts[o.office]}; })
    );
    el.innerHTML = chips.map(function(c){
      var active = state.office===c.office ? ' active' : '';
      return '<div class="chip'+active+'" data-office="'+escapeAttr(c.office)+'"><span class="chip-dot"></span>'+c.label+' <span class="chip-count">'+c.count+'</span></div>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(chip){
      chip.addEventListener('click', function(){
        state.office = chip.getAttribute('data-office');
        renderChips();
        renderRepGrid();
      });

    renderRepGrid();
  }

  function fullRender(){
    applyI18n();
    fullRenderData();
  }

  // ---------------- Event wiring ----------------
  document.getElementById('langEnBtn').addEventListener('click', function(){
    state.lang='en'; this.classList.add('active'); document.getElementById('langFrBtn').classList.remove('active'); fullRender();
  });
  document.getElementById('langFrBtn').addEventListener('click', function(){
    state.lang='fr'; this.classList.add('active'); document.getElementById('langEnBtn').classList.remove('active'); fullRender();
  });

  Array.prototype.forEach.call(document.querySelectorAll('#dateSegment button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#dateSegment button'), function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.range = btn.getAttribute('data-range');
      renderCustomRangeUI();
      fullRenderData();
    });
  });

  document.getElementById('columnsBtn').addEventListener('click', function(e){
    e.stopPropagation();
    var panel = document.getElementById('columnsPanel');
    if (panel.hasAttribute('hidden')){ renderColumnsPanel(); panel.removeAttribute('hidden'); }
    else { panel.setAttribute('hidden',''); }
  });
  document.addEventListener('click', function(e){
    var panel = document.getElementById('columnsPanel');
    var btn = document.getElementById('columnsBtn');
    if (!panel.hasAttribute('hidden') && !panel.contains(e.target) && e.target!==btn && !btn.contains(e.target)){
      panel.setAttribute('hidden','');
    }
  });

  document.getElementById('repSearch').addEventListener('input', function(e){ state.search = e.target.value; renderRepGrid(); });
  document.getElementById('sortSelect').addEventListener('change', function(e){ state.sort = e.target.value; renderRepGrid(); });

  document.getElementById('footerRight').textContent = 'Generated ' + new Date().toLocaleDateString('en-CA');

  fullRender();
})();

</script>
</body>
</html>
